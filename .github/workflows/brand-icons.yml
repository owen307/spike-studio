name: Brand icons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/brand-icons.yml

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Render the SP monogram
        run: python3 scripts/render_brand.py

      - name: Commit launcher icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand android/app/src/main/res linux/runner/resources macos/Runner/Assets.xcassets web windows/runner/resources
          if git diff --cached --quiet; then
            echo "Icons already match."
            exit 0
          fi
          git commit -m "Add SP circuit monogram launcher icons"
          git push
